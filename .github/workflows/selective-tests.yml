# Review 2 deliverable: tia running in a realistic CI pipeline.
#
# The pipeline tests tia with tia. It builds a map over this repository's own
# suite, then asks for the selection for the pull request's actual diff and
# runs it through the pytest plugin.
#
# The honest part is the last step: the full suite runs too, and the job fails
# if the selection passed while the full suite failed. In a real pipeline that
# check is what earns the right to stop running the full suite — you keep it
# until the miss rate is measured, not before.

name: selective tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  selective:
    name: tia selection vs full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tia needs history to resolve the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev,eval]"

      - name: Work out what we are diffing against
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "base=$(git rev-parse "$BASE")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the map at the base commit
        run: |
          # A map is built from the code as it was BEFORE the change — that is
          # the whole point. Building it at HEAD would make the map newer than
          # the diff base, and the classifier would correctly refuse it as
          # MAP_STALE.
          git checkout -q ${{ steps.base.outputs.base }}
          tia init
          tia build
          git checkout -q ${{ steps.base.outputs.head }}

      - name: Map summary
        run: tia status

      - name: What would tia select for this change?
        run: |
          tia select --base ${{ steps.base.outputs.base }} --explain
          tia select --base ${{ steps.base.outputs.base }} --format json > selection.json
          cat selection.json

      - name: Run the selected tests through the plugin
        run: pytest --tia --tia-base=${{ steps.base.outputs.base }} -q

      - name: Full suite, as the safety net
        run: pytest -q

      - name: Publish the selection as a build artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tia-selection
          path: selection.json
          if-no-files-found: warn
