# tia, testing itself with its own GitHub Action (action.yml at the repo root).
#
# This is the pattern a project adopting tia copies:
#   - on every push to main, build the map once and cache it for that commit;
#   - on every other branch and pull request, restore the map for the branch
#     point and run only what it selects.
#
# The full test suite still runs in ci.yml. Keep it until tia's miss rate has
# been measured on your own codebase; that is what earns the right to drop it.

name: selective tests

on:
  push:
  pull_request:

jobs:
  map:
    name: build the map (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,eval]"
      - run: |
          git config --global user.name "tia ci"
          git config --global user.email "ci@tia.invalid"
      - uses: ./
        with:
          mode: build

  select:
    name: run the selected tests
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the branch point is found with git merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,eval]"
      - run: |
          git config --global user.name "tia ci"
          git config --global user.email "ci@tia.invalid"
      - uses: ./
        with:
          mode: test
